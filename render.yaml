# render.yaml - Render Blueprint for 9Router
# Deploy: Render Dashboard -> New -> Blueprint -> connect this repo
services:
  - type: web
    name: 9router
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "10000"
      - key: HOSTNAME
        value: "0.0.0.0"
      - key: NODE_ENV
        value: "production"
      - key: DATA_DIR
        value: "/app/data"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # Persistence (Cloudflare R2) - fill these in Render dashboard
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_ENDPOINT
        sync: false
